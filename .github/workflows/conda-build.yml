name: conda-build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # The suite, on a bare runner. Nothing here has the R oracle, the private
  # test IDATs or a populated store, so every data-backed target SKIPs -- and
  # that is the point: it proves the binary builds, that every driver is
  # well-formed and skips cleanly rather than dying (which is how `make test`
  # once aborted at test-liftover and silently dropped the twelve targets
  # after it), and that the docs still describe this binary. The numeric gates
  # and the coverage measurement need the oracle, so they belong to the
  # release SOP, run on the HPC, not to CI.
  selftest:
    name: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build
        run: make -j4

      - name: Suite (everything data-backed SKIPs; a driver that dies fails)
        run: make test

      - name: Docs gate
        run: make test-docs-check

  build:
    needs: selftest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: linux-64}
          - {os: macos-14,      name: osx-arm64}
          # osx-64 (macos-13, Intel) dropped: GitHub is retiring Intel runners,
          # so those jobs queue indefinitely. osx-arm64 covers modern Macs.
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # YAME + its nested htslib

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        run: conda install -n base -y conda-build anaconda-client

      # zhou-lab supplies yame, which the recipe declares as a run dependency,
      # so conda-build needs it to solve the TEST env -- not just the build one.
      # Without it linux-64 fails outright ("yame >=1.33 does not exist"), while
      # macOS accidentally passes: its filesystem is case-insensitive, so
      # conda-build's "missing dependency, look for a recipe" fallback matches
      # the YAME/ submodule against a lowercase yame/ and quietly builds yame
      # from source instead. Naming the channel makes both platforms do the same
      # thing, and use the published package.
      - name: Build package
        run: |
          conda build -c conda-forge -c zhou-lab \
            --output-folder "$RUNNER_TEMP/bld" conda-recipe/

      # The runner's glibc is far newer than users'. If the sysroot pin ever
      # comes loose, the binary silently picks up symbols no ordinary machine
      # has and dies at startup -- how sesame-cli and tabl both shipped broken.
      - name: Check glibc floor (linux-64)
        if: matrix.name == 'linux-64'
        run: python tools/check_glibc_floor.py "$RUNNER_TEMP/bld"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.name }}
          path: ${{ runner.temp }}/bld/**/*.conda
          if-no-files-found: error

      - name: Publish to zhou-lab (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          if [ -z "${ANACONDA_TOKEN:-}" ]; then
            echo "ANACONDA_TOKEN secret is not set; cannot publish." >&2
            exit 1
          fi
          # guard: the pushed tag must match the recipe version
          version=$(sed -n 's/.*set version = "\(.*\)".*/\1/p' conda-recipe/meta.yaml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match recipe version $version; bump meta.yaml" >&2
            exit 1
          fi
          for pkg in "$RUNNER_TEMP"/bld/*/*.conda; do
            echo "uploading $pkg"
            conda run -n base anaconda -t "$ANACONDA_TOKEN" upload -u zhou-lab --label main --force "$pkg"
          done
